[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rustdate"
version = "0.2.0"
description = "Fast dateutil-compatible date/time parsing for Python, written in Rust (PyO3)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Deevi Eswar" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.maturin]
manifest-path = "Cargo.toml"
